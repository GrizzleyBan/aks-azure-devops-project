apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aks-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: acraksproj987.azurecr.io/api:v1
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aks-demo
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 5000